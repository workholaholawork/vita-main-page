<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Заглушка для фотографии</title>
  <desc id="desc">Замените путь в атрибуте src элемента img на путь к фотографии.</desc>
  <defs>
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#eaf3f3" />
      <rect x="14" width="14" height="28" fill="#d5e7e7" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#stripes)" />
  <text x="400" y="250" fill="#218a8b" font-family="Arial, sans-serif" font-size="24" font-weight="700"
    text-anchor="middle" dominant-baseline="middle">ФОТО</text>
</svg>
